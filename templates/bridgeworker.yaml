Description: Bridge Worker Platform Application
AWSTemplateFormatVersion: 2010-09-09
Parameters:
  AwsDefaultVpcId:
    Description: The AWS account's default VPC id
    Type: "AWS::EC2::VPC::Id"
  AwsSnsNotificationEndpoint:
    Type: String
    Description: Email address for AWS SNS notifications
  BackfillBucket:
    Type: String
  BridgeEnv:
    Type: String
    Default: dev
  BridgeUser:
    Type: String
    Default: heroku
  BridgeWorkerEmail:
    Type: String
    Default: bridgeit+worker@sagebase.org
  BridgeWorkerPassword:
    Type: String
    NoEcho: true
  BridgeWorkerStudy:
    Type: String
    Default: api
  EC2InstanceType:
    Type: String
    Description: Instance type to use for Elastic Beanstalk Instances
    Default: t2.micro
  Env:
    Type: String
    Default: develop
  JavaHeapSize:
    Type: String
    Default: 1g
  NewRelicAppName:
    Type: String
  NewRelicLicenseKey:
    Type: String
    NoEcho: true
  RawHealthDataBucket:
    Type: String
  SynapseAccessToken:
    Type: String
    NoEcho: true
  SynapsePrincipalId:
    Type: String
  SynapseUser:
    Type: String
  UploadBucket:
    Type: String
  UploadCertBucket:
    Type: String
  UploadPrivateKeyBucket:
    Type: String
  UserDataBucket:
    Type: String
  ParticipantRosterBucket:
    Type: String
  WorkerSqsQueueUrl:
    Type: String
  # ---- ADDF Export ---------------------------------------------------------
  AddfExportStoreBucket:
    Type: String
    Description: ADDF export-store bucket name (created by the addf-export stack)
  AddfExportRequestSqsQueueUrl:
    Type: String
    Description: ADDF export request queue URL (created by the addf-export stack)
  AddfExportDlqSqsQueueUrl:
    Type: String
    Description: ADDF export DLQ URL (for redrive/monitoring tooling)
  AddfAzureContainerUrl:
    Type: String
    Description: Azure Blob staging container URL (non-secret, ADDI-provided)
  AddfBlobSasToken:
    Type: String
    NoEcho: true
    Description: SAS token for the Azure staging container (resolved from SSM at deploy)
  AddfBlobSasExpiry:
    Type: String
    Description: SAS token expiry date (read by the Phase 6 pre-expiry alarm)
  AddfExportEnabled:
    Type: String
    Default: 'false'
    Description: Kill-switch - accumulate/export worker runs only when true
  AddfPublishEnabled:
    Type: String
    Default: 'false'
    Description: Kill-switch - AzCopy publish to Azure runs only when true
Resources:
  AWSEBConfigurationTemplate:
    Type: 'AWS::ElasticBeanstalk::ConfigurationTemplate'
    Properties:
      ApplicationName: !Ref AWSEBApplication
      SolutionStackName: '64bit Amazon Linux 2 v4.7.7 running Tomcat 9 Corretto 8'
      OptionSettings:
        # EB environment options
        - Namespace: 'aws:elasticbeanstalk:xray'
          OptionName: XRayEnabled
          Value: 'false'
        - Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: IamInstanceProfile
          Value: !Ref AWSIAMInstanceProfile
        - Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: InstanceType
          Value: !Ref EC2InstanceType
        - Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: SecurityGroups
          Value: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - AWSEC2SecurityGroup
        - Namespace: 'aws:elasticbeanstalk:command'
          OptionName: DeploymentPolicy
          Value: 'AllAtOnce'
        - Namespace: 'aws:elasticbeanstalk:environment'
          OptionName: EnvironmentType
          Value: 'SingleInstance'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: NEW_RELIC_APP_NAME
          Value: !Ref 'NewRelicAppName'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: NEW_RELIC_LICENSE_KEY
          Value: !Ref NewRelicLicenseKey
        - Namespace: 'aws:elasticbeanstalk:environment'
          OptionName: ServiceRole
          Value: !Ref AWSIAMServiceRole
        - Namespace: 'aws:elasticbeanstalk:cloudwatch:logs'
          OptionName: StreamLogs
          Value: 'true'
        - Namespace: 'aws:elasticbeanstalk:cloudwatch:logs'
          OptionName: DeleteOnTerminate
          Value: 'true'
        - Namespace: 'aws:elasticbeanstalk:cloudwatch:logs'
          OptionName: RetentionInDays
          Value: '90'
        - Namespace: 'aws:elasticbeanstalk:container:tomcat:jvmoptions'
          OptionName: Xms
          Value: !Ref JavaHeapSize
        - Namespace: 'aws:elasticbeanstalk:container:tomcat:jvmoptions'
          OptionName: Xmx
          Value: !Ref JavaHeapSize
        - Namespace: 'aws:elasticbeanstalk:hostmanager'
          OptionName: LogPublicationControl
          Value: 'true'
        - Namespace: 'aws:elasticbeanstalk:sqsd'
          OptionName: HttpConnections
          Value: '10'
        - Namespace: 'aws:elasticbeanstalk:sqsd'
          OptionName: ErrorVisibilityTimeout
          Value: '2'
        # Application environment options
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: ENV
          Value: !Ref Env
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.env
          Value: !Ref BridgeEnv
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.user
          Value: !Ref BridgeUser
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.email
          Value: !Ref BridgeWorkerEmail
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.password
          Value: !Ref 'BridgeWorkerPassword'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.study
          Value: !Ref BridgeWorkerStudy
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.appId
          Value: !Ref BridgeWorkerStudy
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.access.token
          Value: !Ref SynapseAccessToken
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.principal.id
          Value: !Ref SynapsePrincipalId
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.user
          Value: !Ref SynapseUser
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.userdata.bucket'
          Value: !Ref UserDataBucket
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.workerPlatform.request.sqs.queue.url'
          Value: !Ref WorkerSqsQueueUrl
        # ---- ADDF Export env ----
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.export.request.sqs.queue.url'
          Value: !Ref AddfExportRequestSqsQueueUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.export.dlq.sqs.queue.url'
          Value: !Ref AddfExportDlqSqsQueueUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.exportstore.bucket'
          Value: !Ref AddfExportStoreBucket
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.azure.container.url'
          Value: !Ref AddfAzureContainerUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.azure.sas.token
          Value: !Ref AddfBlobSasToken
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.azure.sas.expiry
          Value: !Ref AddfBlobSasExpiry
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.export.enabled
          Value: !Ref AddfExportEnabled
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.publish.enabled
          Value: !Ref AddfPublishEnabled
        # Allocation id of the dedicated ADDF-egress EIP, consumed by the
        # app-side ebextensions association hook (eip-associate.config).
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: ADDF_EGRESS_EIP_ALLOCATION_ID
          Value: !GetAtt AddfEgressEip.AllocationId
  AWSEBApplication:
    Type: 'AWS::ElasticBeanstalk::Application'
    Properties:
      ApplicationName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - application
      ResourceLifecycleConfig:
        ServiceRole: !GetAtt AWSIAMServiceRole.Arn
        VersionLifecycleConfig:
          MaxAgeRule:
            DeleteSourceFromS3: true
            Enabled: true
            MaxAgeInDays: 90
  AWSEBEnvironment:
    Type: 'AWS::ElasticBeanstalk::Environment'
    Properties:
      ApplicationName: !Ref AWSEBApplication
      TemplateName: !Ref AWSEBConfigurationTemplate
      EnvironmentName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
      Tier:
        Name: Worker
        Type: SQS/HTTP
  AWSS3AppDeployBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  AWSIAMDdbManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 'dynamodb:CreateTable'
              - 'dynamodb:DeleteItem'
              - 'dynamodb:DescribeTable'
              - 'dynamodb:GetItem'
              - 'dynamodb:PutItem'
              - 'dynamodb:Query'
              - 'dynamodb:UpdateItem'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-FitBitTables'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-HealthId'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-NotificationConfig'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-NotificationLog'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-Study'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-SynapseSurveyTables'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-UploadSchema/index/studyId-index'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-UploadSchema'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-WorkerLog'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-exporter-SynapseMetaTables'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-exporter-SynapseTables'
  AWSIAMS3ManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:s3:::${BackfillBucket}/*'
              - !Sub 'arn:aws:s3:::${RawHealthDataBucket}/*'
              - !Sub 'arn:aws:s3:::${UploadBucket}/*'
              - !Sub 'arn:aws:s3:::${UploadCertBucket}/*'
              - !Sub 'arn:aws:s3:::${UploadPrivateKeyBucket}/*'
              - !Sub 'arn:aws:s3:::${UserDataBucket}/*'
              - !Sub 'arn:aws:s3:::${ParticipantRosterBucket}/*'
  # ADDF export-store bucket: workers read raw, write derived tables, coalesce & clean up staging
  AWSIAMAddfExportStoreManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:DeleteObject'
              Resource:
                - !Sub 'arn:aws:s3:::${AddfExportStoreBucket}/*'
            - Effect: Allow
              Action:
                - 's3:ListBucket'
              Resource:
                - !Sub 'arn:aws:s3:::${AddfExportStoreBucket}'
  # ADDF request queue (consume) + DLQ (redrive). Scoped; the worker-tier managed
  # policy already permits SQS broadly - this documents and narrows intent.
  AWSIAMAddfSqsManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'sqs:ReceiveMessage'
                - 'sqs:DeleteMessage'
                - 'sqs:ChangeMessageVisibility'
                - 'sqs:GetQueueAttributes'
              Resource:
                - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:Bridge-ADDF-Export-Request-${BridgeEnv}'
            - Effect: Allow
              Action:
                - 'sqs:SendMessage'
                - 'sqs:GetQueueAttributes'
              Resource:
                - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:Bridge-ADDF-Export-DLQ-${BridgeEnv}'
  # ADDF Azure egress: allow the SingleInstance worker to attach the dedicated
  # Elastic IP (AddfEgressEip) to itself at deploy/launch time. This pins a
  # stable, replacement-proof source IP so the Azure Blob staging storage
  # firewall can allowlist exactly one address. ec2:AssociateAddress /
  # DescribeAddresses do not support resource-level scoping, hence '*'.
  AWSIAMEipAssociateManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'ec2:AssociateAddress'
                - 'ec2:DescribeAddresses'
              Resource:
                - '*'
  AWSIAMSesManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 'ses:SendEmail'
              - 'ses:SendRawEmail'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
  # cloudwatch integration https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/AWSHowTo.cloudwatchlogs.html
  AWSIAMCloudwatchIntegrationManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:GetLogEvents'
              - 'logs:PutLogEvents'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
              - 'logs:PutRetentionPolicy'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:*:*'
  AWSIAMServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - elasticbeanstalk.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                sts:ExternalId: elasticbeanstalk
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth'
        - 'arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService'
  AWSIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier'
        - !Ref AWSIAMDdbManagedPolicy
        - !Ref AWSIAMS3ManagedPolicy
        - !Ref AWSIAMAddfExportStoreManagedPolicy
        - !Ref AWSIAMAddfSqsManagedPolicy
        - !Ref AWSIAMEipAssociateManagedPolicy
        - !Ref AWSIAMSesManagedPolicy
        - !Ref AWSIAMCloudwatchIntegrationManagedPolicy
  AWSIAMInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref AWSIAMRole
  AWSSNSTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      Subscription:
        -
          Endpoint: !Ref AwsSnsNotificationEndpoint
          Protocol: "email"
  # App Service User
  AWSIAMBridgeWorkerServiceUserAccessKey:
    Type: 'AWS::IAM::AccessKey'
    Properties:
      UserName: !Ref AWSIAMBridgeWorkerServiceUser
  AWSIAMBridgeWorkerServiceUser:
    Type: 'AWS::IAM::User'
    Properties:
      Groups:
        - !Ref AWSIAMBridgeWorkerServiceUserGroup
  AWSIAMBridgeWorkerServiceUserGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier'
        - !Ref AWSIAMDdbManagedPolicy
        - !Ref AWSIAMS3ManagedPolicy
        - !Ref AWSIAMSesManagedPolicy
  AWSLBSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Load Balancer Security Group
      VpcId: !Ref AwsDefaultVpcId
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: 443
          ToPort: 443
          IpProtocol: tcp
        - CidrIp: 0.0.0.0/0
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
  AWSEC2SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - AWSEC2SecurityGroup
      GroupDescription: EC2 Security Group
      VpcId: !Ref AwsDefaultVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AWSLBSecurityGroup
  # Dedicated Elastic IP for ADDF Azure egress.
  # The allocation is durable across instance replacement; the app-side
  # ebextensions hook (eip-associate.config) associates it to the current
  # SingleInstance host on every deploy/launch. The PublicIp output is the
  # single value to allowlist on the Azure staging storage-account firewall.
  AddfEgressEip:
    Type: 'AWS::EC2::EIP'
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-addf-egress-eip'
        - Key: purpose
          Value: addf-azure-egress
  # KMS Keys
  AWSKmsKey:
    Type: "AWS::KMS::Key"
    Properties:
      Description: !Join
        - '-'
        - - !Ref AWS::StackName
          - "KmsKey"
      EnableKeyRotation: "true"
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          -
            Sid: "Allow administration of the key"
            Effect: "Allow"
            Principal:
              AWS:
                - !Join
                  - ''
                  - - 'arn:aws:iam::'
                    - !Ref AWS::AccountId
                    - ':root'
                - !ImportValue us-east-1-bootstrap-CfServiceRoleArn
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
            Resource: "*"
          -
            Sid: "Allow use of the key"
            Effect: "Allow"
            Principal:
              AWS:
                - !Join
                  - ''
                  - - 'arn:aws:iam::'
                    - !Ref AWS::AccountId
                    - ':root'
                - !ImportValue us-east-1-bootstrap-CfServiceRoleArn
                - !GetAtt AWSIAMBridgeWorkerServiceUser.Arn
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
  # Logs and cloudwatch
  AWSKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Join
        - ''
        - - 'alias/'
          - !Ref AWS::StackName
          - '/KmsKey'
      TargetKeyId: !Ref AWSKmsKey

  AWSLogsTomcatLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Join
        - '/'
        - - /aws/elasticbeanstalk
          - !Ref 'AWS::StackName'
          - var/log/tomcat8/catalina.out
      RetentionInDays: 90
  TomcatLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Join
        - '/'
        - - /aws/elasticbeanstalk
          - !Ref 'AWS::StackName'
          - var/log/tomcat/catalina.out
      RetentionInDays: 90

  AWSCWRequestActivityMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: '"org.sagebionetworks.bridge.reporter.worker.BridgeReporterProcessor - Request took"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/RequestActivity"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestActivityCount
  TomcatRequestActivityMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: '"org.sagebionetworks.bridge.reporter.worker.BridgeReporterProcessor - Request took"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/RequestActivity"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestActivityCount

  AWSCWRequestErrorMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: 'ERROR
                      - "HttpResponseException: Forbidden"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Errors"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestErrorCount
  TomcatRequestErrorMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: 'ERROR
                      - "HttpResponseException: Forbidden"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Errors"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestErrorCount

  AWSCWRequestErrorAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - RequestErrorCount
      Namespace: LogMetrics/Errors
      Period: 3600
      Statistic: Sum
      Threshold: 10
      TreatMissingData: notBreaching

  AWSCWRequestWarningMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: 'WARN - WarningHeaderInterceptor'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Warnings"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestWarningCount
  TomcatRequestWarningMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: 'WARN - WarningHeaderInterceptor'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Warnings"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestWarningCount

  AWSCWRequestWarningAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - RequestWarningCount
      Namespace: LogMetrics/Warnings
      Period: 3600
      Statistic: Sum
      Threshold: 100
      TreatMissingData: notBreaching

  AWSCWHeartbeatMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: 'org.sagebionetworks.bridge.heartbeat.HeartbeatLogger'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Health"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - HeartbeatCount
  TomcatHeartbeatMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: 'org.sagebionetworks.bridge.heartbeat.HeartbeatLogger'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Health"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - HeartbeatCount

  AWSCWHealthCheckAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: LessThanOrEqualToThreshold
      Threshold: 0
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - HeartbeatCount
      Namespace: LogMetrics/Health
      Period: 3600
      Statistic: SampleCount
      TreatMissingData: breaching

Outputs:
  AWSSNSTopic:
    Value: !Ref AWSSNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-SnsTopic'
  AWSS3AppDeployBucket:
    Value: !Ref AWSS3AppDeployBucket
    Export:
      Name: !Sub '${AWS::StackName}-AppDeployBucket'
  UserDataBucket:
    Value: !Ref UserDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-UserDataBucket'
  AWSKmsKey:
    Value: !Ref AWSKmsKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKey'
  AWSKmsKeyAlias:
    Value: !Ref AWSKmsKeyAlias
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyAlias'
  AddfEgressEipPublicIp:
    Description: Stable worker egress IP to allowlist on the Azure ADDF staging storage firewall
    Value: !Ref AddfEgressEip
    Export:
      Name: !Sub '${AWS::StackName}-AddfEgressEipPublicIp'
  AddfEgressEipAllocationId:
    Description: Allocation id of the dedicated ADDF-egress Elastic IP
    Value: !GetAtt AddfEgressEip.AllocationId
    Export:
      Name: !Sub '${AWS::StackName}-AddfEgressEipAllocationId'
