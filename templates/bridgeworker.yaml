Description: Bridge Worker Platform Application
AWSTemplateFormatVersion: 2010-09-09
Parameters:
  AwsDefaultVpcId:
    Description: The AWS account's default VPC id
    Type: "AWS::EC2::VPC::Id"
  AwsSnsNotificationEndpoint:
    Type: String
    Description: Email address for AWS SNS notifications
  BackfillBucket:
    Type: String
  BridgeEnv:
    Type: String
    Default: dev
  BridgeUser:
    Type: String
    Default: heroku
  BridgeWorkerEmail:
    Type: String
    Default: bridgeit+worker@sagebase.org
  BridgeWorkerPassword:
    Type: String
    NoEcho: true
  BridgeWorkerStudy:
    Type: String
    Default: api
  BridgeServer:
    Type: String
    Default: ''
    Description: >-
      Full URL (with https://) of the Bridge (BS2) server the worker signs into. Passed straight to the REST
      client as the base URL; a blank/scheme-less value crashes Spring context init (okhttp "no colon" -> no SQS
      consumers). Set per-env in config/<env>. Emitted to EB for uat only (see the IsUat-gated option below).
  EC2InstanceType:
    Type: String
    Description: Instance type to use for Elastic Beanstalk Instances
    Default: t2.micro
  Env:
    Type: String
    Default: develop
  JavaHeapSize:
    Type: String
    Default: 1g
  NewRelicAppName:
    Type: String
  NewRelicLicenseKey:
    Type: String
    NoEcho: true
  RawHealthDataBucket:
    Type: String
  SynapseAccessToken:
    Type: String
    NoEcho: true
  SynapsePrincipalId:
    Type: String
  SynapseUser:
    Type: String
  UploadBucket:
    Type: String
  UploadCertBucket:
    Type: String
  UploadPrivateKeyBucket:
    Type: String
  UserDataBucket:
    Type: String
  ParticipantRosterBucket:
    Type: String
  BridgeServer:
    Type: String
    Description: URL of the Bridge server (e.g. https://bridge-uat.grip-research.org)
  S3NotificationSqsQueueUrl:
    Type: String
    Description: SQS queue URL for S3 upload-complete notifications
  SynapseEndpoint:
    Type: String
    Default: https://repo-prod.prod.sagebase.org/
    Description: Synapse REST endpoint (prod or dev)
  WorkerSqsQueueUrl:
    Type: String
  # ---- ADDF Export ---------------------------------------------------------
  AddfExportStoreBucket:
    Type: String
    Description: ADDF export-store bucket name (created by the addf-export stack)
  AddfExportRequestSqsQueueUrl:
    Type: String
    Description: ADDF export request queue URL (created by the addf-export stack)
  AddfExportDlqSqsQueueUrl:
    Type: String
    Description: ADDF export DLQ URL (for redrive/monitoring tooling)
  AddfAzureContainerUrl:
    Type: String
    Description: Azure Blob staging container URL (non-secret, ADDI-provided)
  AddfBlobSasToken:
    Type: String
    NoEcho: true
    Description: SAS token for the Azure staging container (resolved from SSM at deploy)
  AddfBlobSasExpiry:
    Type: String
    Description: SAS token expiry date (read by the Phase 6 pre-expiry alarm)
  AddfExportEnabled:
    Type: String
    Default: 'false'
    Description: Kill-switch - accumulate/export worker runs only when true
  AddfPublishEnabled:
    Type: String
    Default: 'false'
    Description: Kill-switch - AzCopy publish to Azure runs only when true
  AddfPublishHeartbeatActionsEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      Arm the daily publish-heartbeat alarm (§6.4). Keep 'false' while addf.publish.enabled=false so the alarm
      does not page on the (expected) absence of publish-success logs; flip to 'true' in Phase 8 when publish goes
      live. When on, a missing daily "ADDF publish succeeded" log fires the alarm (dead scheduler / wedged publish).
Conditions:
  AddfPublishHeartbeatActionsOn: !Equals [!Ref AddfPublishHeartbeatActionsEnabled, 'true']
  # Emit bridge.server to the EB env for uat only, so dev/prod EB environments are left byte-identical to today
  # (this rollout is uat-only). Widen when those envs are rolled out and their BridgeServer values are set.
  IsUat: !Equals [!Ref BridgeEnv, uat]
Resources:
  AWSEBConfigurationTemplate:
    Type: 'AWS::ElasticBeanstalk::ConfigurationTemplate'
    # DependsOn: AWSEC2SecurityGroup
    Properties:
      ApplicationName: !Ref AWSEBApplication
      SolutionStackName: '64bit Amazon Linux 2 v4.13.3 running Tomcat 9 Corretto 8'
      OptionSettings:
        # EB environment options
        - Namespace: 'aws:elasticbeanstalk:xray'
          OptionName: XRayEnabled
          Value: 'false'
        - Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: IamInstanceProfile
          Value: !Ref AWSIAMInstanceProfile
        - Namespace: 'aws:autoscaling:launchconfiguration'
          OptionName: InstanceType
          Value: !Ref EC2InstanceType
        - Namespace: 'aws:ec2:vpc'
          OptionName: VPCId
          Value: !ImportValue us-east-1-bridge-vpc-with-subnets-VPC
        - Namespace: 'aws:ec2:vpc'
          OptionName: Subnets
          Value: !Join
            - ','
            - - !ImportValue us-east-1-bridge-vpc-with-subnets-PrivateSubnet1
              - !ImportValue us-east-1-bridge-vpc-with-subnets-PrivateSubnet2
        - Namespace: 'aws:ec2:vpc'
          OptionName: AssociatePublicIpAddress
          Value: 'false'
        # - Namespace: 'aws:autoscaling:launchconfiguration'
        #   OptionName: SecurityGroups
        #   Value: !Ref AWSEC2SecurityGroup
        - Namespace: 'aws:elasticbeanstalk:command'
          OptionName: DeploymentPolicy
          Value: 'AllAtOnce'
        - Namespace: 'aws:elasticbeanstalk:environment'
          OptionName: EnvironmentType
          Value: 'SingleInstance'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: NEW_RELIC_APP_NAME
          Value: !Ref 'NewRelicAppName'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: NEW_RELIC_LICENSE_KEY
          Value: !Ref NewRelicLicenseKey
        - Namespace: 'aws:elasticbeanstalk:environment'
          OptionName: ServiceRole
          Value: !Ref AWSIAMServiceRole
        - Namespace: 'aws:elasticbeanstalk:cloudwatch:logs'
          OptionName: StreamLogs
          Value: 'true'
        - Namespace: 'aws:elasticbeanstalk:cloudwatch:logs'
          OptionName: DeleteOnTerminate
          Value: 'true'
        - Namespace: 'aws:elasticbeanstalk:cloudwatch:logs'
          OptionName: RetentionInDays
          Value: '90'
        - Namespace: 'aws:elasticbeanstalk:container:tomcat:jvmoptions'
          OptionName: Xms
          Value: !Ref JavaHeapSize
        - Namespace: 'aws:elasticbeanstalk:container:tomcat:jvmoptions'
          OptionName: Xmx
          Value: !Ref JavaHeapSize
        - Namespace: 'aws:elasticbeanstalk:hostmanager'
          OptionName: LogPublicationControl
          Value: 'true'
        - Namespace: 'aws:elasticbeanstalk:sqsd'
          OptionName: HttpConnections
          Value: '10'
        - Namespace: 'aws:elasticbeanstalk:sqsd'
          OptionName: ErrorVisibilityTimeout
          Value: '2'
        # Application environment options
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: ENV
          Value: !Ref Env
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.env
          Value: !Ref BridgeEnv
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.user
          Value: !Ref BridgeUser
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.email
          Value: !Ref BridgeWorkerEmail
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.password
          Value: !Ref 'BridgeWorkerPassword'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.study
          Value: !Ref BridgeWorkerStudy
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.worker.appId
          Value: !Ref BridgeWorkerStudy
        # uat-only (IsUat): sets the Bridge (BS2) base URL the worker signs into. Without it the app reads the
        # .conf placeholder and crashes at startup. Gated so dev/prod EB envs are untouched by this change.
        - !If
          - IsUat
          - Namespace: 'aws:elasticbeanstalk:application:environment'
            OptionName: bridge.server
            Value: !Ref BridgeServer
          - !Ref 'AWS::NoValue'
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.access.token
          Value: !Ref SynapseAccessToken
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.principal.id
          Value: !Ref SynapsePrincipalId
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.user
          Value: !Ref SynapseUser
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: bridge.server
          Value: !Ref BridgeServer
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: synapse.endpoint
          Value: !Ref SynapseEndpoint
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.s3.notification.sqs.queue.url'
          Value: !Ref S3NotificationSqsQueueUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.userdata.bucket'
          Value: !Ref UserDataBucket
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.workerPlatform.request.sqs.queue.url'
          Value: !Ref WorkerSqsQueueUrl
        # ---- ADDF Export env ----
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.export.request.sqs.queue.url'
          Value: !Ref AddfExportRequestSqsQueueUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.export.dlq.sqs.queue.url'
          Value: !Ref AddfExportDlqSqsQueueUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.exportstore.bucket'
          Value: !Ref AddfExportStoreBucket
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: !Join
            - ''
            - - !Ref BridgeEnv
              - '.addf.azure.container.url'
          Value: !Ref AddfAzureContainerUrl
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.azure.sas.token
          Value: !Ref AddfBlobSasToken
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.azure.sas.expiry
          Value: !Ref AddfBlobSasExpiry
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.export.enabled
          Value: !Ref AddfExportEnabled
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: addf.publish.enabled
          Value: !Ref AddfPublishEnabled
        # Allocation id of the dedicated ADDF-egress EIP, consumed by the
        # app-side ebextensions association hook (eip-associate.config).
        - Namespace: 'aws:elasticbeanstalk:application:environment'
          OptionName: ADDF_EGRESS_EIP_ALLOCATION_ID
          Value: !GetAtt AddfEgressEip.AllocationId
  AWSEBApplication:
    Type: 'AWS::ElasticBeanstalk::Application'
    Properties:
      ApplicationName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - application
      ResourceLifecycleConfig:
        ServiceRole: !GetAtt AWSIAMServiceRole.Arn
        VersionLifecycleConfig:
          MaxAgeRule:
            DeleteSourceFromS3: true
            Enabled: true
            MaxAgeInDays: 90
  AWSEBEnvironment:
    Type: 'AWS::ElasticBeanstalk::Environment'
    Properties:
      ApplicationName: !Ref AWSEBApplication
      TemplateName: !Ref AWSEBConfigurationTemplate
      EnvironmentName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
      Tier:
        Name: Worker
        Type: SQS/HTTP
  AWSS3AppDeployBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      # EB's platform-hooks/deploy worker uploads bundles with bucket-owner-full-control ACLs,
      # so the deploy bucket cannot be BucketOwnerEnforced (which blocks ACLs entirely).
      # Use BucketOwnerPreferred: ACLs still work, and any ACL-tagged uploads are auto-owned
      # by the bucket owner. New AWS accounts default new buckets to Enforced, hence the explicit setting.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  AWSIAMDdbManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 'dynamodb:CreateTable'
              - 'dynamodb:DeleteItem'
              - 'dynamodb:DescribeTable'
              - 'dynamodb:GetItem'
              - 'dynamodb:PutItem'
              - 'dynamodb:Query'
              - 'dynamodb:UpdateItem'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-FitBitTables'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-HealthId'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-NotificationConfig'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-NotificationLog'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-Study'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-SynapseSurveyTables'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-UploadSchema/index/studyId-index'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-UploadSchema'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-${BridgeUser}-WorkerLog'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-exporter-SynapseMetaTables'
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BridgeEnv}-exporter-SynapseTables'
  AWSIAMS3ManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:s3:::${BackfillBucket}/*'
              - !Sub 'arn:aws:s3:::${RawHealthDataBucket}/*'
              - !Sub 'arn:aws:s3:::${UploadBucket}/*'
              - !Sub 'arn:aws:s3:::${UploadCertBucket}/*'
              - !Sub 'arn:aws:s3:::${UploadPrivateKeyBucket}/*'
              - !Sub 'arn:aws:s3:::${UserDataBucket}/*'
              - !Sub 'arn:aws:s3:::${ParticipantRosterBucket}/*'
  # ADDF export-store bucket: workers read raw, write derived tables, coalesce & clean up staging
  AWSIAMAddfExportStoreManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:DeleteObject'
              Resource:
                - !Sub 'arn:aws:s3:::${AddfExportStoreBucket}/*'
            - Effect: Allow
              Action:
                - 's3:ListBucket'
              Resource:
                - !Sub 'arn:aws:s3:::${AddfExportStoreBucket}'
  # ADDF request queue (consume) + DLQ (redrive). Scoped; the worker-tier managed
  # policy already permits SQS broadly - this documents and narrows intent.
  AWSIAMAddfSqsManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'sqs:ReceiveMessage'
                - 'sqs:DeleteMessage'
                - 'sqs:ChangeMessageVisibility'
                - 'sqs:GetQueueAttributes'
              Resource:
                - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:Bridge-ADDF-Export-Request-${BridgeEnv}'
            - Effect: Allow
              Action:
                - 'sqs:SendMessage'
                - 'sqs:GetQueueAttributes'
              Resource:
                - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:Bridge-ADDF-Export-DLQ-${BridgeEnv}'
  # ADDF Azure egress: allow the SingleInstance worker to attach the dedicated
  # Elastic IP (AddfEgressEip) to itself at deploy/launch time. This pins a
  # stable, replacement-proof source IP so the Azure Blob staging storage
  # firewall can allowlist exactly one address. ec2:AssociateAddress /
  # DescribeAddresses do not support resource-level scoping, hence '*'.
  AWSIAMEipAssociateManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - 'ec2:AssociateAddress'
                - 'ec2:DescribeAddresses'
              Resource:
                - '*'
  AWSIAMSesManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 'ses:SendEmail'
              - 'ses:SendRawEmail'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*'
  # cloudwatch integration https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/AWSHowTo.cloudwatchlogs.html
  AWSIAMCloudwatchIntegrationManagedPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:GetLogEvents'
              - 'logs:PutLogEvents'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
              - 'logs:PutRetentionPolicy'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:*:*'
  AWSIAMServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - elasticbeanstalk.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                sts:ExternalId: elasticbeanstalk
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth'
        - 'arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService'
  AWSIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier'
        - !Ref AWSIAMDdbManagedPolicy
        - !Ref AWSIAMS3ManagedPolicy
        - !Ref AWSIAMAddfExportStoreManagedPolicy
        - !Ref AWSIAMAddfSqsManagedPolicy
        - !Ref AWSIAMEipAssociateManagedPolicy
        - !Ref AWSIAMSesManagedPolicy
        - !Ref AWSIAMCloudwatchIntegrationManagedPolicy
  AWSIAMInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref AWSIAMRole
  AWSSNSTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      Subscription:
        -
          Endpoint: !Ref AwsSnsNotificationEndpoint
          Protocol: "email"
  # App Service User
  AWSIAMBridgeWorkerServiceUserAccessKey:
    Type: 'AWS::IAM::AccessKey'
    Properties:
      UserName: !Ref AWSIAMBridgeWorkerServiceUser
  AWSIAMBridgeWorkerServiceUser:
    Type: 'AWS::IAM::User'
    Properties:
      Groups:
        - !Ref AWSIAMBridgeWorkerServiceUserGroup
  AWSIAMBridgeWorkerServiceUserGroup:
    Type: 'AWS::IAM::Group'
    Properties:
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier'
        - !Ref AWSIAMDdbManagedPolicy
        - !Ref AWSIAMS3ManagedPolicy
        - !Ref AWSIAMSesManagedPolicy
  AWSLBSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Load Balancer Security Group
      VpcId: !ImportValue us-east-1-bridge-vpc-with-subnets-VPC
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: 443
          ToPort: 443
          IpProtocol: tcp
        - CidrIp: 0.0.0.0/0
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          FromPort: 80
          ToPort: 80
          IpProtocol: tcp
  AWSEC2SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - AWSEC2SecurityGroup
      GroupDescription: EC2 Security Group
      VpcId: !ImportValue us-east-1-bridge-vpc-with-subnets-VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AWSLBSecurityGroup
  # Dedicated Elastic IP for ADDF Azure egress.
  # The allocation is durable across instance replacement; the app-side
  # ebextensions hook (eip-associate.config) associates it to the current
  # SingleInstance host on every deploy/launch. The PublicIp output is the
  # single value to allowlist on the Azure staging storage-account firewall.
  AddfEgressEip:
    Type: 'AWS::EC2::EIP'
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-addf-egress-eip'
        - Key: purpose
          Value: addf-azure-egress
  # KMS Keys
  AWSKmsKey:
    Type: "AWS::KMS::Key"
    Properties:
      Description: !Join
        - '-'
        - - !Ref AWS::StackName
          - "KmsKey"
      EnableKeyRotation: "true"
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          -
            Sid: "Allow administration of the key"
            Effect: "Allow"
            Principal:
              AWS:
                - !Join
                  - ''
                  - - 'arn:aws:iam::'
                    - !Ref AWS::AccountId
                    - ':root'
                - !ImportValue us-east-1-bootstrap-CfServiceRoleArn
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
            Resource: "*"
          -
            Sid: "Allow use of the key"
            Effect: "Allow"
            Principal:
              AWS:
                - !Join
                  - ''
                  - - 'arn:aws:iam::'
                    - !Ref AWS::AccountId
                    - ':root'
                - !ImportValue us-east-1-bootstrap-CfServiceRoleArn
                - !GetAtt AWSIAMBridgeWorkerServiceUser.Arn
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
  # Logs and cloudwatch
  AWSKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Join
        - ''
        - - 'alias/'
          - !Ref AWS::StackName
          - '/KmsKey'
      TargetKeyId: !Ref AWSKmsKey

  AWSLogsTomcatLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Join
        - '/'
        - - /aws/elasticbeanstalk
          - !Ref 'AWS::StackName'
          - var/log/tomcat8/catalina.out
      RetentionInDays: 90
  TomcatLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Join
        - '/'
        - - /aws/elasticbeanstalk
          - !Ref 'AWS::StackName'
          - var/log/tomcat/catalina.out
      RetentionInDays: 90

  AWSCWRequestActivityMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: '"org.sagebionetworks.bridge.reporter.worker.BridgeReporterProcessor - Request took"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/RequestActivity"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestActivityCount
  TomcatRequestActivityMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: '"org.sagebionetworks.bridge.reporter.worker.BridgeReporterProcessor - Request took"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/RequestActivity"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestActivityCount

  AWSCWRequestErrorMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: 'ERROR
                      - "HttpResponseException: Forbidden"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Errors"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestErrorCount
  TomcatRequestErrorMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: 'ERROR
                      - "HttpResponseException: Forbidden"'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Errors"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestErrorCount

  AWSCWRequestErrorAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - RequestErrorCount
      Namespace: LogMetrics/Errors
      Period: 3600
      Statistic: Sum
      Threshold: 10
      TreatMissingData: notBreaching

  AWSCWRequestWarningMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: 'WARN - WarningHeaderInterceptor'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Warnings"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestWarningCount
  TomcatRequestWarningMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: 'WARN - WarningHeaderInterceptor'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Warnings"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - RequestWarningCount

  AWSCWRequestWarningAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - RequestWarningCount
      Namespace: LogMetrics/Warnings
      Period: 3600
      Statistic: Sum
      Threshold: 100
      TreatMissingData: notBreaching

  AWSCWHeartbeatMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: 'org.sagebionetworks.bridge.heartbeat.HeartbeatLogger'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Health"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - HeartbeatCount
  TomcatHeartbeatMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: 'org.sagebionetworks.bridge.heartbeat.HeartbeatLogger'
      MetricTransformations:
        -
          MetricValue: "1"
          MetricNamespace: "LogMetrics/Health"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - HeartbeatCount

  AWSCWHealthCheckAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: LessThanOrEqualToThreshold
      Threshold: 0
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - HeartbeatCount
      Namespace: LogMetrics/Health
      Period: 3600
      Statistic: SampleCount
      TreatMissingData: breaching

  AWSCWDiskUsageAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Threshold: 80
      TreatMissingData: notBreaching
      Metrics:
        - Id: disk_max
          Expression: "SELECT MAX(disk_used_percent) FROM SCHEMA(\"CWAgent\", device, fstype, host, path) WHERE path = '/'"
          Period: 300
          ReturnData: true
          Label: MaxDiskUsedPercent

  # ---- ADDF publish heartbeat (Phase 6 §6.4) -------------------------------
  # Positive-signal liveness for the daily publish. The publish worker logs "ADDF publish succeeded" only on the
  # confirmed-upload success path (AddfPublishWorkerProcessor, after the _publish/<date>.done marker); a log metric
  # filter turns that line into a daily datapoint. Modelled on the existing HeartbeatCount health check - a
  # positive metric with treatMissingData=breaching catches a silently-dead EventBridge scheduler, a wedged
  # publish, or a crash before the marker, none of which an error-presence alarm can see. Alarm actions stay off
  # (param) until publish is enabled so the expected pre-rollout absence does not page.
  AWSCWAddfPublishHeartbeatMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref AWSLogsTomcatLogGroup
      FilterPattern: '"ADDF publish succeeded"'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "LogMetrics/Health"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - AddfPublishHeartbeatCount
  TomcatAddfPublishHeartbeatMetricFilter:
    Type: "AWS::Logs::MetricFilter"
    Properties:
      LogGroupName: !Ref TomcatLogGroup
      FilterPattern: '"ADDF publish succeeded"'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "LogMetrics/Health"
          MetricName: !Join
            - '-'
            - - !Ref 'AWS::StackName'
              - AddfPublishHeartbeatCount
  AWSCWAddfPublishHeartbeatAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub 'Bridge-ADDF-Publish-Heartbeat-${BridgeEnv}'
      AlarmDescription: >-
        No successful ADDF publish in the last 24h - the daily publish did not run (dead EventBridge scheduler,
        wedged publish, or a crash before the done-marker). Stale data would be delivered downstream with no
        other error. Arm via AddfPublishHeartbeatActionsEnabled once publish is live (Phase 8).
      ActionsEnabled: !If [AddfPublishHeartbeatActionsOn, true, false]
      # This alarm lives in the bridgeworker stack (its metric filter needs that stack's Tomcat log groups), so it
      # routes to that stack's ops topic - same as the sibling RequestError/Warning/HealthCheck alarms - rather
      # than the addf-export stack's AddfOpsSnsTopic. Avoids a cross-stack Fn::ImportValue Sceptre can't order on.
      AlarmActions:
        - !Ref AWSSNSTopic
      OKActions:
        - !Ref AWSSNSTopic
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      EvaluationPeriods: 1
      MetricName: !Join
        - '-'
        - - !Ref 'AWS::StackName'
          - AddfPublishHeartbeatCount
      Namespace: LogMetrics/Health
      Period: 86400
      Statistic: Sum
      TreatMissingData: breaching

Outputs:
  AWSSNSTopic:
    Value: !Ref AWSSNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-SnsTopic'
  AWSS3AppDeployBucket:
    Value: !Ref AWSS3AppDeployBucket
    Export:
      Name: !Sub '${AWS::StackName}-AppDeployBucket'
  UserDataBucket:
    Value: !Ref UserDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-UserDataBucket'
  AWSKmsKey:
    Value: !Ref AWSKmsKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKey'
  AWSKmsKeyAlias:
    Value: !Ref AWSKmsKeyAlias
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyAlias'
  AddfEgressEipPublicIp:
    Description: Stable worker egress IP to allowlist on the Azure ADDF staging storage firewall
    Value: !Ref AddfEgressEip
    Export:
      Name: !Sub '${AWS::StackName}-AddfEgressEipPublicIp'
  AddfEgressEipAllocationId:
