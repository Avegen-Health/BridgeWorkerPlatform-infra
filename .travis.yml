sudo: false
language: python
python: 3.11
cache: pip
fast_finish: true
branches:
  only:
  - develop
  - uat
  - prod
install:
- wget https://github.com/Sage-Bionetworks/infra-utils/archive/refs/tags/v1.0.9.zip
  -O /tmp/infra-utils.zip
- unzip -j -n /tmp/infra-utils.zip -x "infra-utils-1.0.9/.gitignore" "infra-utils-1.0.9/LICENSE"
  "infra-utils-1.0.9/*.md" "infra-utils-1.0.9/aws/*"
- "./setup_aws_cli.sh || travis_terminate 1"
- pip install --upgrade pip setuptools wheel
- pip install PyYAML==6.0.1
- pip install deepdiff@git+https://github.com/seperman/deepdiff.git
- pip install aws-sam-translator>=1.50.0
- pip install cfn-lint
- pip install sceptre>=4
- pip install sceptre-ssm-resolver
stages:
- name: validate
- name: deploy
  if: type = push
# Gated operator actions (ADDF implementation-plan §3b.4). Never runs on a push:
# it requires an env var that only an API-triggered build supplies, so it cannot
# fire by accident. Trigger with ADDF_BACKFILL=uat (participant-version backfill)
# or ADDF_REPUBLISH=uat (force today's re-publish). See scripts/addf-ops.sh.
- name: addf-ops
  if: env(ADDF_BACKFILL) IS present OR env(ADDF_REPUBLISH) IS present
jobs:
  include:
  - stage: validate
    script: cfn-lint ./templates/**/* --ignore-checks W2001
  - stage: deploy
    script: sceptre launch $TRAVIS_BRANCH --yes
  - stage: addf-ops
    script: ./scripts/addf-ops.sh
