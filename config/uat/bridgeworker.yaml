template_path: bridgeworker.yaml
stack_name: bridgeworker-uat
parameters:
  AwsDefaultVpcId: vpc-06153fdc5047df63c
  AwsSnsNotificationEndpoint: akash.shinde@avegenhealth.com
  BackfillBucket: org-gvbridge-backfill-devstaging
  BridgeEnv: uat
  BridgeUser: heroku
  BridgeWorkerEmail: akash.shinde@avegenhealth.com
  BridgeWorkerStudy: api
  BridgeWorkerPassword: !ssm /bridgeworker-uat/BridgeWorkerPassword
  EC2InstanceType: t3a.medium
  Env: staging
  NewRelicAppName: bridgeworker-uat
  NewRelicLicenseKey: !ssm /infra/NewRelicLicenseKey
  RawHealthDataBucket: org-gvbridge-rawhealthdata-devstaging
  SynapseAccessToken:  !ssm /bridgeworker-uat/SynapseAccessToken
  SynapsePrincipalId: '3336429'
  SynapseUser: bridgetest
  UploadBucket: org-gvbridge-upload-devstaging
  UploadCertBucket: org-gvbridge-upload-cms-cert-devstaging
  UploadPrivateKeyBucket: org-gvbridge-upload-cms-priv-devstaging
  UserDataBucket: org-gvbridge-userdata-devstaging
  ParticipantRosterBucket: org-gvbridge-participantroster-devstaging
  WorkerSqsQueueUrl: https://sqs.us-east-1.amazonaws.com/433864969993/Bridge-WorkerPlatform-Request-staging
  # ADDF export - queue/bucket created by the bridgeworker-addf-export-uat stack (deploy it first)
  AddfExportStoreBucket: org-gvbridge-addf-exportstore-uat
  AddfExportRequestSqsQueueUrl: https://sqs.us-east-1.amazonaws.com/433864969993/Bridge-ADDF-Export-Request-uat
  AddfExportDlqSqsQueueUrl: https://sqs.us-east-1.amazonaws.com/433864969993/Bridge-ADDF-Export-DLQ-uat
  # Blocked on ADDI: replace placeholder with the real Azure staging container URL before enabling publish
  AddfAzureContainerUrl: PLACEHOLDER_BLOCKED_ON_ADDI
  AddfBlobSasToken: !ssm /bridgeworker-uat/AddfBlobSasToken
  AddfBlobSasExpiry: !ssm /bridgeworker-uat/AddfBlobSasExpiry
  AddfExportEnabled: 'false'
  AddfPublishEnabled: 'false'
