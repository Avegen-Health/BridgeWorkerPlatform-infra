template_path: addf-export.yaml
stack_name: bridgeworker-addf-export-uat
parameters:
  BridgeEnv: uat
  OpsNotificationEndpoint: bridge+uat_ops_notif@avegenhealth.com
  VisibilityTimeout: '300'
  MaxReceiveCount: '5'
  # uat runs on the -staging general worker queue (see config/uat/bridgeworker.yaml WorkerSqsQueueUrl),
  # NOT Bridge-WorkerPlatform-Request-uat. The publish message must ride that exact queue's poller.
  PublishTargetQueueArn: arn:aws:sqs:us-east-1:433864969993:Bridge-WorkerPlatform-Request-staging
  # TEMPORARY fast schedule for interactive testing on uat. Revert to cron(0 7 * * ? *)
  # (07:00 UTC daily = US night / off-peak) once testing is done.
  #
  # Note: publish is idempotent on the biaffect-3/_publish/<date>.done marker, so a 5-minute
  # tick only produces one real delivery per UTC day - later ticks short-circuit on
  # isPublished() in 0s. To force a re-publish, delete that day's .done marker in the Azure
  # container and wait for the next tick.
  #
  # Previous temporary near-term schedules, each reverted afterwards:
  #  - 2026-09-22, rate(5 minutes): scheduler -> queue -> AddfPublishWorker dispatch (publish still disabled,
  #    confirmed by the "ADDF publish disabled ... skipping" worker logs).
  #  - 2026-09-23, rate(10 minutes): first real end-to-end publish. Snapshot built, blobs uploaded to the uat
  #    Azure container, and biaffect-3/_publish/2026-09-23.done written - a marker that is only created after the
  #    upload confirms. Later ticks correctly short-circuited on isPublished() in 0s.
  PublishScheduleExpression: rate(5 minutes)
  PublishScheduleState: ENABLED
